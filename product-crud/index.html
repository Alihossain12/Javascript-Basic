<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product CRUD App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .form-section {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
    }

    .table-section {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
    }

    .btn-custom {
      background-color: #0d6efd;
      color: white;
      border-radius: 8px;
      transition: 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #084298;
      color: white;
    }
  </style>
</head>
<body class="py-5">

  <div class="container">
    <h2 class="text-center mb-5 fw-bold text-primary">🛒 Product CRUD Application</h2>

    <div class="row g-4">
      <!-- Left Side - Form -->
      <div class="col-md-4">
        <div class="form-section">
          <h5 class="mb-3">Add / Edit Product</h5>
          <form id="product-form">
            <input type="hidden" id="product-id">

            <div class="mb-3">
              <label for="product-name" class="form-label">Product Name</label>
              <input type="text" id="product-name" class="form-control" placeholder="Enter product name" required>
            </div>

            <div class="mb-3">
              <label for="product-price" class="form-label">Product Price</label>
              <input type="number" id="product-price" class="form-control" placeholder="Enter product price" required>
            </div>

            <div class="mb-3">
              <label for="product-description" class="form-label">Description</label>
              <textarea id="product-description" class="form-control" rows="3" placeholder="Enter product description"></textarea>
            </div>

            <button type="submit" class="btn btn-custom w-100">💾 Save Product</button>
          </form>
        </div>
      </div>

      <!-- Right Side - Table -->
      <div class="col-md-8">
        <div class="table-section">
          <h5 class="mb-3">Product List</h5>
          <div class="table-responsive">
            <table id="product-table" class="table table-bordered table-hover align-middle">
              <thead class="table-primary text-center">
                <tr>
                  <th style="width: 10%;">ID</th>
                  <th style="width: 25%;">Name</th>
                  <th style="width: 15%;">Price ($)</th>
                  <th style="width: 20%;">Actions</th>
                </tr>
              </thead>
              <tbody class="text-center">
                <tr>
                  <td>1</td>
                  <td>Sample Product</td>
                  <td>99.99</td>
                  <td>
                    <button class="btn btn-sm btn-warning me-1">Edit</button>
                    <button class="btn btn-sm btn-danger">Delete</button>
                  </td>
                </tr>
                <!-- Dynamic data will be inserted here -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts.js"></script>
</body>
</html>
